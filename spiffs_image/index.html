<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 Lua Controller</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f4f9; color: #333; max-width: 800px; margin: 0 auto; padding: 20px; }
        h1 { color: #2c3e50; text-align: center; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .script-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #eee; }
        .script-item:last-child { border-bottom: none; }
        .btn { background-color: #3498db; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-size: 14px; transition: background 0.3s; }
        .btn:hover { background-color: #2980b9; }
        .btn:disabled { background-color: #bdc3c7; cursor: not-allowed; }
        .btn.run { background-color: #27ae60; }
        .btn.run:hover { background-color: #219653; }
        #status { margin-top: 15px; padding: 10px; border-radius: 4px; display: none; text-align: center; font-weight: bold; }
        .status-success { background-color: #d4edda; color: #155724; }
        .status-error { background-color: #f8d7da; color: #721c24; }
        .status-loading { background-color: #fff3cd; color: #856404; }
    </style>
</head>
<body>

    <h1>🚀 ESP32 Lua Controller</h1>

    <div class="card">
        <h2>📂 Доступные скрипты</h2>
        <div id="script-list">Загрузка списка...</div>
    </div>

    <div id="status"></div>

    <script>
        const statusDiv = document.getElementById('status');
        const listDiv = document.getElementById('script-list');

        // Функция для показа статуса
        function showStatus(message, type) {
            statusDiv.textContent = message;
            statusDiv.className = 'status-' + type;
            statusDiv.style.display = 'block';
        }

        // Загрузка списка скриптов при открытии страницы
        async function loadScripts() {
            try {
                const response = await fetch('/api/scripts');
                if (!response.ok) throw new Error('Network response was not ok');
                const scripts = await response.json();
                
                listDiv.innerHTML = ''; // Очистить "Загрузка..."
                
                if (scripts.length === 0) {
                    listDiv.innerHTML = '<p style="text-align:center; color:#777;">Папка /scripts пуста</p>';
                    return;
                }

                scripts.forEach(file => {
                    const item = document.createElement('div');
                    item.className = 'script-item';
                    
                    const nameSpan = document.createElement('span');
                    nameSpan.textContent = '📜 ' + file;
                    
                    const btn = document.createElement('button');
                    btn.className = 'btn run';
                    btn.textContent = '▶ Запустить';
                    btn.onclick = () => runScript(file, btn);
                    
                    item.appendChild(nameSpan);
                    item.appendChild(btn);
                    listDiv.appendChild(item);
                });
            } catch (error) {
                listDiv.innerHTML = '<p style="color:red; text-align:center;">Ошибка загрузки списка: ' + error.message + '</p>';
            }
        }

        // Функция запуска скрипта
        async function runScript(filename, btnElement) {
            // Блокируем кнопку на время выполнения
            btnElement.disabled = true;
            btnElement.textContent = '⏳ Выполняется...';
            showStatus(`Выполнение скрипта: ${filename}...`, 'loading');

            try {
                // Кодируем имя файла для безопасной передачи в URL
                const response = await fetch(`/api/run?file=${encodeURIComponent(filename)}`);
                const result = await response.json();

                if (response.ok && result.status === 'success') {
                    showStatus('✅ Скрипт успешно выполнен!', 'success');
                } else {
                    showStatus('❌ Ошибка: ' + (result.message || 'Неизвестная ошибка'), 'error');
                }
            } catch (error) {
                showStatus('❌ Ошибка сети: ' + error.message, 'error');
            } finally {
                // Разблокируем кнопку
                btnElement.disabled = false;
                btnElement.textContent = '▶ Запустить';
            }
        }

        // Запускаем загрузку при старте
        loadScripts();
    </script>
    <!-- UPDATE TEST -->
</body>
</html>
