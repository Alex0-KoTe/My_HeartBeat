<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 Lua Controller</title>
    <!-- Подключаем внешние стили -->
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="container">
        <h1>🚀 ESP32 Lua Controller</h1>
        
        <!-- Карточка списка скриптов -->
        <div class="card">
            <h2>📂 Доступные скрипты</h2>
            <div id="script-list">Загрузка списка...</div>
        </div>
        
        <!-- Карточка загрузки скрипта -->
        <div class="card">
            <h2>📤 Загрузить скрипт</h2>
            <div class="upload-area" id="upload-area">
                <input type="file" id="file-input" accept=".lua" style="display: none;">
                <button onclick="document.getElementById('file-input').click()" class="btn">
                     Выбрать файл
                </button>
                <span id="file-name">Файл не выбран</span>
                <button onclick="uploadFile()" class="btn run" id="upload-btn" disabled>
                    ⬆️ Загрузить
                </button>
            </div>
            <div id="upload-status"></div>
        </div>
        
        <!-- Карточка терминала -->
        <div class="card">
            <h2>💻 Системный терминал</h2>
            
            <div class="status-bar">
                <div class="status-indicator">
                    <div class="status-dot" id="status-dot"></div>
                    <span id="status-text">Готов к работе</span>
                </div>
                <div class="terminal-controls">
                    <button onclick="stopScript()" class="btn btn-small btn-stop" id="stop-btn" style="display: none;">
                        ⏹ Остановить
                    </button>
                    <button onclick="clearTerminal()" class="btn btn-small">Очистить</button>
                    <button onclick="refreshLogs()" class="btn btn-small">Обновить</button>
                </div>
            </div>
            
            <div class="terminal" id="terminal-output">
                <div class="log-line log-system">ESP32 System Terminal v1.0</div>
                <div class="log-line log-system">Ожидание команд...</div>
            </div>
        </div>
    </div>

    <!-- Подключаем внешний скрипт -->
    <script src="/script.js"></script>
</body>
</html>
